<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>追星少女 — StarCatcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Preconnect to ESA Hubble CDN for astrophotography images -->
  <link rel="preconnect" href="https://cdn.esahubble.org">
  <link rel="dns-prefetch" href="https://cdn.esahubble.org">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <!-- Preload sprite assets so game canvas shows immediately on level entry -->
  <link rel="preload" href="assets/sprites/girl.svg" as="image" type="image/svg+xml">
  <link rel="preload" href="assets/sprites/net.svg" as="image" type="image/svg+xml">
  <link rel="preload" href="assets/sprites/debris-meteor.svg" as="image" type="image/svg+xml">
  <link rel="preload" href="assets/sprites/debris-satellite.svg" as="image" type="image/svg+xml">
  <link rel="preload" href="assets/sprites/debris-rocket.svg" as="image" type="image/svg+xml">
  <link rel="preload" href="assets/sprites/debris-cloth.svg" as="image" type="image/svg+xml">
</head>
<body>

<!-- Custom star cursor -->
<div id="star-cursor" aria-hidden="true">★</div>

<!-- Particle starfield (UI background) -->
<canvas id="star-canvas" aria-hidden="true"></canvas>

<!-- App root -->
<div id="app">

  <!-- ① Main Menu ──────────────────────────────────────────── -->
  <section id="screen-menu" class="screen" role="main">
    <div class="menu-inner">
      <button id="menu-mute-btn" class="btn-menu-mute" aria-label="静音">🔊</button>
      <h1 class="game-title">追星少女</h1>
      <p class="game-subtitle">StarCatcher</p>
      <div class="menu-buttons">
        <button class="btn btn-primary btn-play" aria-label="开始游戏">
          ✦ 挑战关卡
        </button>
        <button class="btn btn-secondary btn-gallery" aria-label="星座展厅">
          ☽ 星座展厅
        </button>
        <button class="btn btn-ghost btn-shop-from-menu" aria-label="道具商店">
          🛒 道具商店
        </button>
      </div>
      <p class="menu-deco">— 在深邃星空中，追逐每一颗遥远的星光 —</p>
    </div>
  </section>

  <!-- ② Level Select ───────────────────────────────────────── -->
  <section id="screen-levels" class="screen" role="main">
    <div class="levels-header">
      <button class="btn btn-ghost btn-back-menu">← 返回主菜单</button>
      <h2>✦ 挑战关卡</h2>
      <button class="btn btn-ghost btn-shop-from-levels">🛒 商店</button>
    </div>
    <div class="level-grid" role="list" aria-label="关卡列表">
      <!-- Cards injected by JS -->
    </div>
  </section>

  <!-- ③ Game Screen ────────────────────────────────────────── -->
  <section id="screen-game" class="screen" role="main">
    <canvas id="gameCanvas" aria-label="游戏画面"></canvas>
    <div class="hud" aria-live="polite">
      <div class="hud-top">
        <div class="hud-level-name">猎户座 · 第1关</div>
        <div class="hud-timer-ring" aria-label="剩余时间">
          <svg class="timer-ring-svg" viewBox="0 0 56 56" aria-hidden="true">
            <circle class="timer-ring-bg" cx="28" cy="28" r="24" />
            <circle class="timer-ring-fill" id="timer-ring-fill" cx="28" cy="28" r="24" />
          </svg>
          <div class="hud-timer" id="hud-timer-text">01:30</div>
        </div>
        <div class="hud-stars">
          <span>★</span>
          <span class="star-count">0/7</span>
        </div>
        <!-- Pause + mute grouped at right — no overlap -->
        <div class="hud-top-right">
          <button id="pause-btn" class="pause-btn" aria-label="暂停">⚙</button>
          <button id="mute-btn" class="hud-mute-btn" aria-label="静音">🔊</button>
        </div>
      </div>
      <div class="hud-active-items" id="hud-active-items"></div>
    </div>
    <!-- Tutorial hint overlay -->
    <div id="game-hint" class="game-hint" aria-live="polite">
      <div class="hint-inner">
        <span class="hint-icon">🖱️</span>
        <span class="hint-text">点击 / 空格 发射网兜</span>
      </div>
    </div>
    <!-- Pause overlay -->
    <div id="pause-overlay" class="pause-overlay hidden" aria-modal="true">
      <div class="pause-panel">
        <h3 class="pause-title">游戏暂停</h3>
        <button id="pause-resume-btn" class="btn btn-primary pause-action-btn">▶ 继续游戏</button>
        <button id="pause-retry-btn"  class="btn btn-secondary pause-action-btn">重新开始</button>
        <div id="pause-exit-wrap" class="pause-exit-wrap">
          <button id="pause-exit-btn" class="btn btn-ghost pause-action-btn">退出关卡</button>
          <div id="pause-confirm" class="pause-confirm hidden">
            <span>确认退出?</span>
            <button id="pause-confirm-yes" class="btn btn-danger pause-confirm-btn">✓</button>
            <button id="pause-confirm-no"  class="btn btn-ghost  pause-confirm-btn">✗</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ④ Level Complete / Fail ──────────────────────────────── -->
  <section id="screen-complete" class="screen" role="main">
    <div class="complete-inner">
      <!-- Header row: mini canvas + title + stars + new record inline -->
      <div class="complete-header-row">
        <canvas id="constellation-canvas" width="80" height="80"
                aria-label="星座连线动画" class="complete-mini-canvas"></canvas>
        <div class="complete-header-text">
          <div class="complete-title-line">
            <span class="complete-star-rating"></span>
            <span class="complete-title">✨ 关卡完成！</span>
          </div>
          <div class="complete-subtitle"></div>
        </div>
      </div>
      <!-- Stats: one horizontal row -->
      <div class="complete-stats">
        <span class="stat-item-inline"><span class="stat-caught">0/7</span> 已抓</span>
        <span class="stat-sep">·</span>
        <span class="stat-item-inline"><span class="stat-time">0秒</span> 剩余</span>
        <span class="stat-sep">·</span>
        <span class="stat-item-inline"><span class="stat-coins">0</span> 金币</span>
      </div>
      <!-- Astrophoto -->
      <div class="complete-photo-wrap">
        <img id="complete-photo" class="complete-photo" src="" alt="" loading="lazy">
        <div id="complete-photo-placeholder" class="complete-photo-placeholder" aria-hidden="true">★</div>
      </div>
      <!-- Lore (dominant) -->
      <div class="complete-lore">
        <span class="lore-title"></span>
        <div class="lore-text"></div>
      </div>
      <!-- Fail encouragement (shown only on fail screen, hidden on complete) -->
      <div class="fail-encouragement" style="display:none">
        <canvas id="fail-constellation-canvas" width="320" height="220"
                aria-label="星座剪影" class="fail-mini-canvas"></canvas>
        <p class="fail-encouragement-text">再试一次，星座等着你！✨</p>
      </div>
      <!-- CTAs -->
      <div class="complete-buttons">
        <button class="btn btn-primary btn-shop complete-cta-btn">去商店 →</button>
        <div class="complete-secondary-btns">
          <button class="btn btn-secondary btn-next-level">下一关</button>
          <button class="btn btn-ghost btn-back-levels">返回选关</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ⑤ Gallery ────────────────────────────────────────────── -->
  <section id="screen-gallery" class="screen" role="main">
    <div class="gallery-header">
      <button class="btn btn-ghost btn-back-menu-from-gallery">← 返回主菜单</button>
      <h2>☽ 星座展厅</h2>
      <span style="width:120px"></span>
    </div>
    <div class="gallery-grid" role="list" aria-label="星座展厅">
      <!-- Cards injected by JS -->
    </div>
  </section>

  <!-- ⑤ Gallery Detail ──────────────────────────────────────── -->
  <section id="screen-gallery-detail" class="screen" role="main">
    <div class="detail-inner">
      <div class="detail-hero">
        <h2 class="detail-name-zh"></h2>
        <p class="detail-name-en"></p>
      </div>
      <div class="detail-starchart">
        <div class="starchart-label">⭐ 星图 · Star Chart</div>
        <div id="detail-starchart-svg"></div>
      </div>
      <!-- Photos inserted here by JS (_renderPhotoCarousel) after starchart -->
      <div class="detail-meta">
        <div class="detail-meta-row">
          <span class="detail-meta-label">所属天区</span>
          <span class="detail-meta-value" id="detail-region"></span>
        </div>
        <div class="detail-meta-row">
          <span class="detail-meta-label">最佳观测时间</span>
          <span class="detail-meta-value" id="detail-best-view"></span>
        </div>
        <div class="detail-meta-row">
          <span class="detail-meta-label">主要星星</span>
          <span class="detail-meta-value" id="detail-main-stars"></span>
        </div>
      </div>
      <div class="detail-lore">
        <p class="detail-lore-text"></p>
      </div>
      <!-- Return button at bottom for easy access after scrolling -->
      <div class="detail-bottom-back">
        <button class="btn btn-ghost btn-back-gallery-bottom">← 返回展厅</button>
      </div>
    </div>
  </section>

  <!-- ⑥ Shop ─────────────────────────────────────────────────── -->
  <section id="screen-shop" class="screen" role="main">
    <div class="shop-header">
      <button class="btn btn-ghost btn-back-from-shop">← 返回</button>
      <h2>🛒 道具商店</h2>
      <div class="shop-coins">
        <span class="coin-icon">🪙</span>
        <span class="shop-coin-balance">0</span>
        <span class="coin-label">金币</span>
      </div>
    </div>
    <div class="shop-grid" role="list" aria-label="道具列表">
      <!-- Items injected by JS -->
    </div>
  </section>

</div><!-- /app -->

<script type="module" src="js/main.js?v=30"></script>
</body>
</html>
