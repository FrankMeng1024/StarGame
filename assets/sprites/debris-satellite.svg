<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Satellite — solar panels + boxy body -->
  <defs>
    <linearGradient id="panelG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Left solar panel -->
  <rect x="2" y="24" width="20" height="16" rx="2" fill="url(#panelG)" stroke="#3b82f6" stroke-width="0.8"/>
  <!-- Solar panel grid lines -->
  <line x1="2" y1="28" x2="22" y2="28" stroke="rgba(100,160,255,0.5)" stroke-width="0.6"/>
  <line x1="2" y1="32" x2="22" y2="32" stroke="rgba(100,160,255,0.5)" stroke-width="0.6"/>
  <line x1="2" y1="36" x2="22" y2="36" stroke="rgba(100,160,255,0.5)" stroke-width="0.6"/>
  <line x1="8" y1="24" x2="8" y2="40" stroke="rgba(100,160,255,0.4)" stroke-width="0.6"/>
  <line x1="14" y1="24" x2="14" y2="40" stroke="rgba(100,160,255,0.4)" stroke-width="0.6"/>
  <!-- Right solar panel -->
  <rect x="42" y="24" width="20" height="16" rx="2" fill="url(#panelG)" stroke="#3b82f6" stroke-width="0.8"/>
  <line x1="42" y1="28" x2="62" y2="28" stroke="rgba(100,160,255,0.5)" stroke-width="0.6"/>
  <line x1="42" y1="32" x2="62" y2="32" stroke="rgba(100,160,255,0.5)" stroke-width="0.6"/>
  <line x1="42" y1="36" x2="62" y2="36" stroke="rgba(100,160,255,0.5)" stroke-width="0.6"/>
  <line x1="48" y1="24" x2="48" y2="40" stroke="rgba(100,160,255,0.4)" stroke-width="0.6"/>
  <line x1="54" y1="24" x2="54" y2="40" stroke="rgba(100,160,255,0.4)" stroke-width="0.6"/>
  <!-- Connection booms -->
  <line x1="22" y1="32" x2="26" y2="32" stroke="#9ca3af" stroke-width="2"/>
  <line x1="38" y1="32" x2="42" y2="32" stroke="#9ca3af" stroke-width="2"/>
  <!-- Main body box -->
  <rect x="22" y="18" width="20" height="28" rx="3" fill="url(#bodyG)" stroke="#6b7280" stroke-width="1"/>
  <!-- Body panels / texture -->
  <rect x="24" y="20" width="16" height="8" rx="1" fill="rgba(200,210,220,0.4)" stroke="#9ca3af" stroke-width="0.5"/>
  <rect x="24" y="30" width="8" height="8" rx="1" fill="rgba(180,200,220,0.3)" stroke="#9ca3af" stroke-width="0.5"/>
  <rect x="34" y="30" width="6" height="8" rx="1" fill="rgba(180,200,220,0.3)" stroke="#9ca3af" stroke-width="0.5"/>
  <!-- Antenna -->
  <line x1="32" y1="18" x2="32" y2="8" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="32" cy="7" r="3" fill="#ef4444" filter="url(#glow2)" opacity="0.9"/>
  <!-- Thruster nozzle -->
  <path d="M26,46 L38,46 L36,54 L28,54 Z" fill="#6b7280" stroke="#4b5563" stroke-width="0.8"/>
  <!-- Thruster glow -->
  <ellipse cx="32" cy="55" rx="5" ry="3" fill="rgba(100,200,255,0.3)" filter="url(#glow2)"/>
  <!-- Highlight on body -->
  <path d="M24,20 Q32,17 40,20" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
</svg>
