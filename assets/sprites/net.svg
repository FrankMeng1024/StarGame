<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <!--
    Net sprite — drawn tip-down, opening facing up.
    Frame 0 (left 60px): empty net
    Frame 1 (right 60px): net with star inside (bulging/catch state)
    Origin point (0,0) = tip of net bag = attach point for canvas transform
  -->
  <defs>
    <linearGradient id="hoopG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="bagG" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(253,230,138,0.25)"/>
      <stop offset="100%" stop-color="rgba(217,119,6,0.08)"/>
    </radialGradient>
    <linearGradient id="handleG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ════ FRAME 0 — EMPTY NET (x=0..60, tip at 0,55) ════ -->
  <g transform="translate(30,0)">
    <!-- Pole/handle from tip upward — rotated 180 so tip is at bottom -->
    <!-- The net is drawn with opening at top (y=5) and tip at bottom (y=55) -->

    <!-- Bag outline (teardrop) -->
    <path d="M0,5 C-22,12 -22,40 0,52 C22,40 22,12 0,5 Z"
          fill="url(#bagG)" stroke="rgba(253,230,138,0.6)" stroke-width="0.8"/>

    <!-- Hoop (golden circle at top = opening) -->
    <ellipse cx="0" cy="5" rx="22" ry="6" fill="none" stroke="url(#hoopG)" stroke-width="3" filter="url(#glow)"/>

    <!-- Mesh lines — vertical (6 lines) -->
    <g stroke="rgba(253,230,138,0.45)" stroke-width="0.7" fill="none">
      <line x1="-18" y1="8" x2="-10" y2="48"/>
      <line x1="-11" y1="5" x2="-6" y2="50"/>
      <line x1="-4" y1="4" x2="-2" y2="52"/>
      <line x1="4" y1="4" x2="2" y2="52"/>
      <line x1="11" y1="5" x2="6" y2="50"/>
      <line x1="18" y1="8" x2="10" y2="48"/>
    </g>
    <!-- Mesh lines — horizontal (4 rings) -->
    <g stroke="rgba(253,230,138,0.35)" stroke-width="0.6" fill="none">
      <ellipse cx="0" cy="16" rx="18" ry="4"/>
      <ellipse cx="0" cy="27" rx="14" ry="3.5"/>
      <ellipse cx="0" cy="38" rx="9" ry="2.5"/>
      <ellipse cx="0" cy="47" rx="4" ry="1.5"/>
    </g>

    <!-- Tip highlight -->
    <circle cx="0" cy="52" r="2.5" fill="#fde68a" opacity="0.8"/>
    <circle cx="0" cy="52" r="1.2" fill="white" opacity="0.9"/>
  </g>

  <!-- ════ FRAME 1 — CATCH NET (x=60..120, bulging with star) ════ -->
  <g transform="translate(90,0)">
    <!-- Bulging bag (wider) -->
    <path d="M0,5 C-26,10 -28,38 0,50 C28,38 26,10 0,5 Z"
          fill="rgba(253,230,138,0.2)" stroke="rgba(253,230,138,0.7)" stroke-width="1"/>

    <!-- Hoop -->
    <ellipse cx="0" cy="5" rx="22" ry="6" fill="none" stroke="url(#hoopG)" stroke-width="3.5" filter="url(#glow)"/>

    <!-- Glow inside (caught star energy) -->
    <ellipse cx="0" cy="28" rx="16" ry="20" fill="rgba(255,215,0,0.12)"/>

    <!-- Star silhouette inside -->
    <polygon points="0,18 3,25 11,25 5,30 7,38 0,33 -7,38 -5,30 -11,25 -3,25"
             fill="rgba(255,215,0,0.5)" stroke="rgba(255,215,0,0.8)" stroke-width="0.5"/>

    <!-- Mesh lines — vertical -->
    <g stroke="rgba(253,230,138,0.4)" stroke-width="0.7" fill="none">
      <line x1="-18" y1="8" x2="-12" y2="46"/>
      <line x1="-11" y1="5" x2="-7" y2="48"/>
      <line x1="-4" y1="4" x2="-2" y2="50"/>
      <line x1="4" y1="4" x2="2" y2="50"/>
      <line x1="11" y1="5" x2="7" y2="48"/>
      <line x1="18" y1="8" x2="12" y2="46"/>
    </g>
    <!-- Mesh — horizontal -->
    <g stroke="rgba(253,230,138,0.3)" stroke-width="0.6" fill="none">
      <ellipse cx="0" cy="16" rx="20" ry="5"/>
      <ellipse cx="0" cy="27" rx="18" ry="4.5"/>
      <ellipse cx="0" cy="37" rx="13" ry="3.5"/>
      <ellipse cx="0" cy="45" rx="7" ry="2"/>
    </g>

    <!-- Tip -->
    <circle cx="0" cy="50" r="2.5" fill="#fde68a" opacity="0.9"/>
    <circle cx="0" cy="50" r="1.2" fill="white"/>
  </g>
</svg>
