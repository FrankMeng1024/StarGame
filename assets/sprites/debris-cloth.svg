<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Space cloth / debris bag — drifting fabric scrap -->
  <defs>
    <linearGradient id="clothG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="40%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="0.8"/></filter>
  </defs>
  <!-- Main cloth body — wavy organic shape -->
  <path d="M10,20 C14,10 24,8 30,14 C36,8 50,10 54,20 C60,28 56,44 48,50 C44,56 38,58 32,56 C26,58 18,56 14,50 C6,44 4,28 10,20 Z"
        fill="url(#clothG)" stroke="#374151" stroke-width="1"/>
  <!-- Cloth folds / wrinkles -->
  <path d="M18,20 Q24,28 22,38 Q26,44 30,40" fill="none" stroke="rgba(55,65,81,0.6)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M36,18 Q42,26 40,36 Q38,44 44,46" fill="none" stroke="rgba(55,65,81,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14,30 Q24,32 32,30 Q42,32 50,28" fill="none" stroke="rgba(156,163,175,0.4)" stroke-width="1" stroke-linecap="round"/>
  <!-- Torn edge hint -->
  <path d="M10,20 C8,16 12,12 14,16 C16,12 12,8 16,10" fill="none" stroke="#4b5563" stroke-width="1" stroke-linecap="round"/>
  <path d="M54,20 C56,16 52,12 50,16 C48,12 52,8 48,10" fill="none" stroke="#4b5563" stroke-width="1" stroke-linecap="round"/>
  <!-- Patch / marking on cloth -->
  <rect x="26" y="26" width="12" height="10" rx="2" fill="none" stroke="rgba(100,120,140,0.5)" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Fabric highlight -->
  <path d="M14,22 Q26,16 38,18" fill="none" stroke="rgba(200,210,220,0.35)" stroke-width="2" stroke-linecap="round"/>
  <!-- Some small holes/tears -->
  <circle cx="22" cy="34" r="2" fill="#374151" opacity="0.6"/>
  <circle cx="42" cy="38" r="1.5" fill="#374151" opacity="0.5"/>
</svg>
