<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rocket — small red/white rocket with flame -->
  <defs>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="flameG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="rgba(239,68,68,0)"/>
    </linearGradient>
    <filter id="flameBlur"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <!-- Flame (behind rocket) -->
  <ellipse cx="32" cy="56" rx="7" ry="12" fill="rgba(249,115,22,0.3)" filter="url(#flameBlur)"/>
  <path d="M26,50 Q32,58 38,50 Q35,65 32,68 Q29,65 26,50Z" fill="url(#flameG)" opacity="0.85"/>
  <!-- Fins -->
  <path d="M20,42 L18,54 L26,46 Z" fill="#b91c1c" stroke="#991b1b" stroke-width="0.8"/>
  <path d="M44,42 L46,54 L38,46 Z" fill="#b91c1c" stroke="#991b1b" stroke-width="0.8"/>
  <!-- Body -->
  <path d="M24,10 Q32,4 40,10 L42,46 Q32,50 22,46 Z" fill="url(#rocketBody)" stroke="#b91c1c" stroke-width="1"/>
  <!-- Nose cone -->
  <path d="M24,10 Q32,2 40,10 Q36,6 32,5 Q28,6 24,10Z" fill="white" stroke="#e5e7eb" stroke-width="0.5"/>
  <!-- Window -->
  <circle cx="32" cy="26" r="8" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="32" cy="26" r="6" fill="#bfdbfe" stroke="#93c5fd" stroke-width="0.5"/>
  <!-- Window reflection -->
  <ellipse cx="29" cy="23" rx="2.5" ry="1.5" fill="rgba(255,255,255,0.6)" transform="rotate(-30 29 23)"/>
  <!-- Body stripe -->
  <rect x="22" y="36" width="20" height="4" rx="1" fill="white" opacity="0.3"/>
  <!-- Body highlight -->
  <path d="M24,12 Q28,8 34,8" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
