<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Skeletal Animation Demo v2</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center;
       justify-content:center; min-height:100vh; font-family:monospace; color:#aaa; }
h1 { margin-bottom:12px; font-size:13px; color:#555; letter-spacing:2px; text-transform:uppercase; }
canvas { border:1px solid #1a1a2a; background:#0d0d20; }
.controls { margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
button { background:#111127; color:#7788dd; border:1px solid #2a2a44; padding:7px 14px;
         cursor:pointer; font-family:monospace; font-size:12px; border-radius:4px; }
button:hover { background:#1e1e40; color:#fff; }
button.active { background:#1a1a50; color:#aaccff; border-color:#3344aa; }
.info { margin-top:10px; font-size:10px; color:#333; max-width:480px; text-align:center; line-height:1.5; }
.status { margin-top:6px; font-size:10px; color:#3a3a55; }
</style>
</head>
<body>
<h1>Skeletal Animation Demo v2 — Canvas Bones</h1>
<canvas id="c"></canvas>
<div class="controls">
  <button id="btn-idle"    onclick="setState('idle')">Idle</button>
  <button id="btn-throw"   onclick="setState('throw')">Throw</button>
  <button id="btn-catch"   onclick="setState('catch')">Catch</button>
  <button id="btn-retract" onclick="setState('retract')">Retract</button>
  <button id="btn-auto"    onclick="toggleAuto()">&#9654; Auto</button>
</div>
<div class="status" id="status">loading...</div>
<div class="info">
  Body sprite has arms removed. Arms = Canvas bone segments rotating around shoulder joints.
  All transitions are true skeletal interpolation — no sprite switching.
</div>
<script>
// ---- Canvas setup ----
var SCALE = 2;
var FW = 340, FH = 220;   // wider canvas to accommodate pole swing
var canvas = document.getElementById('c');
canvas.width  = FW * SCALE;
canvas.height = FH * SCALE;
var ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---- Skeleton constants (in sprite pixels, will be scaled) ----
// Body sprite: 220x220px
// Shoulders (sprite coords, frame 220x220):
// Arms start at y=117. Left arm: x=83 (leftward). Right arm: x=133 (rightward).
var L_SHX = 83,  L_SHY = 117;
var R_SHX = 133, R_SHY = 117;

// Arm segment lengths (sprite pixels)
var UPPER_LEN = 28;
var LOWER_LEN = 26;
var HAND_R    = 6;

// Pole length
var POLE_LEN  = 68;

// Colors
var SKIN_FILL   = '#FFDFC4';
var SKIN_STROKE = '#D4A882';
var POLE_COL    = '#EAB045';
var POLE_STROKE = '#C8882A';
var STAR_COL    = '#FFD700';

// ---- Keyframe poses ----
// Angle from vertical-DOWN. Positive = clockwise = toward screen-right.
// 0   = straight down
// 90  = straight right
// -90 = straight left
// 180 = straight up
// lLower/rLower = bend relative to upper arm (elbow bend, + = further CW)
// For LEFT arm:  idle hangs left → negative angle (e.g. -15)
// For RIGHT arm: idle hangs right → positive angle (e.g. +15)
// Throw: RIGHT arm raises up-right → angle wraps through 180 to ~-160 (up-left-ish from pivot)
//   Actually: right shoulder is at x=133. Raise arm means upper arm goes UP and slightly right.
//   "Up" = 180deg. "Up-right" from shoulder = ~160deg (almost straight up, tilted right).
// Catch: both arms up-and-outward → left ~-160, right ~160
var POSES = {
  idle: {
    lUpper: -80,  lLower: -10,  // left arm raised up-left (counterbalance)
    rUpper:  155, rLower:  10,  // right arm at swing center (overhead)
    poleAngle: 165,             // pole pointing up from wrist at center position
    bob: true
  },
  throw: {
    lUpper: -20,  lLower: -10,  // left arm slightly out, natural
    rUpper:  155, rLower:  10,  // right arm raised up (past vertical CW → nearly straight up)
    poleAngle: 145,             // pole pointing up-right from wrist
    bob: false
  },
  catch: {
    lUpper: -155, lLower: -10,  // left arm raised up-left
    rUpper:  155, rLower:  10,  // right arm raised up-right
    poleAngle: 150,             // pole up-right
    bob: false
  },
  retract: {
    lUpper: -15,  lLower: -10,  // left returns to rest
    rUpper:  155, rLower:  10,  // right stays raised
    poleAngle: 145,
    bob: false
  }
};

// ---- Swing oscillation ----
// In idle/swing state, right arm swings left↔right continuously
var swingPhase = 0;
// ---- Swing: direct shoulder pivot for wide arc ----
// During idle, we override the right arm+pole as a single rigid rod from shoulder.
// This gives the clearest left↔right sweep across the full canvas.
var SWING_SPEED  = 0.0018;  // rad/ms, ~3.5s per cycle
var SWING_AMP    = 75;      // ±75° → 80°(right) to 230°(left), symmetric arc through overhead
var SWING_CENTER = 155;     // center: overhead. Right=80°, Left=230°
                            // keeps tip inside 680×440 canvas at both extremes

var SWING_CENTER_R    = 130;  // kept for blend-out reference (unused during swing)
var SWING_CENTER_POLE = 48;   // kept for blend-out reference (unused during swing)

// Net head position (computed from pole tip)
// During swing, net dangles from pole tip — shown as a small circle
var NET_LEN = 32;  // net rope length from pole tip

// ---- State machine ----
var currentPose = 'idle';
var targetPose  = 'idle';
var blendT = 1.0;
var BLEND_MS = 280;

var isBlinking = false;
var blinkTimer = 0;
var BLINK_INTERVAL = 3400;
var BLINK_DURATION = 150;
var bobPhase = 0;
var BOB_SPEED = 0.0016;
var BOB_AMP   = 1.8;  // sprite pixels

var autoMode = false;
var AUTO_SEQ = [
  { pose:'idle',    hold:1500 },
  { pose:'throw',   hold:700  },
  { pose:'catch',   hold:900  },
  { pose:'retract', hold:700  },
  { pose:'idle',    hold:1200 },
];
var autoIdx = 0;
var autoHold = 0;

var lastTime = 0;
var bodyImg = null, blinkImg = null;

function lerp(a, b, t) { return a + (b - a) * t; }

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
}

// Interpolate between two poses
function blendPose(src, dst, t) {
  var e = easeInOut(t);
  return {
    lUpper:    lerp(src.lUpper,    dst.lUpper,    e),
    lLower:    lerp(src.lLower,    dst.lLower,    e),
    rUpper:    lerp(src.rUpper,    dst.rUpper,    e),
    rLower:    lerp(src.rLower,    dst.rLower,    e),
    poleAngle: lerp(src.poleAngle, dst.poleAngle, e),
    poleHand:  dst.poleHand,
    bob:       dst.bob
  };
}

function setState(p) {
  if (p === targetPose && blendT >= 1) return;
  if (blendT < 1 && blendT > 0.5) currentPose = targetPose;
  targetPose = p;
  blendT = 0;
  ['idle','throw','catch','retract'].forEach(function(s) {
    var b = document.getElementById('btn-' + s);
    if (b) b.className = (s === p ? 'active' : '');
  });
}

function toggleAuto() {
  autoMode = !autoMode;
  var b = document.getElementById('btn-auto');
  b.textContent = autoMode ? '⏹ Stop' : '▶ Auto';
  if (autoMode) {
    autoIdx = 0;
    autoHold = AUTO_SEQ[0].hold;
    setState(AUTO_SEQ[0].pose);
  }
}

// ---- Draw one arm ----
// ox,oy = shoulder joint (canvas coords)
// upperAngleDeg = angle of upper arm from vertical (degrees)
// lowerAngleDeg = angle of lower arm relative to upper arm (degrees)
function drawArm(ctx, ox, oy, upperAngleDeg, lowerAngleDeg, upperLen, lowerLen, handR, s) {
  var uRad = (upperAngleDeg - 90) * Math.PI / 180;  // -90 so 0 = down
  // Actually: 0deg = straight down = angle PI/2 from positive-x axis
  // Let's define 0 = straight down
  var uA = upperAngleDeg * Math.PI / 180;
  // elbow
  var ex = ox + Math.sin(uA) * upperLen * s;
  var ey = oy + Math.cos(uA) * upperLen * s;

  var lA = uA + lowerAngleDeg * Math.PI / 180;
  // wrist
  var wx = ex + Math.sin(lA) * lowerLen * s;
  var wy = ey + Math.cos(lA) * lowerLen * s;

  var thick = 12 * s;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Upper arm
  ctx.beginPath();
  ctx.moveTo(ox, oy);
  ctx.lineTo(ex, ey);
  ctx.strokeStyle = SKIN_STROKE;
  ctx.lineWidth = thick;
  ctx.stroke();
  ctx.strokeStyle = SKIN_FILL;
  ctx.lineWidth = thick - 3*s;
  ctx.stroke();

  // Lower arm
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(wx, wy);
  ctx.strokeStyle = SKIN_STROKE;
  ctx.lineWidth = thick - 2*s;
  ctx.stroke();
  ctx.strokeStyle = SKIN_FILL;
  ctx.lineWidth = thick - 5*s;
  ctx.stroke();

  // Hand circle
  ctx.beginPath();
  ctx.arc(wx, wy, handR * s, 0, Math.PI * 2);
  ctx.fillStyle = SKIN_STROKE;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(wx, wy, (handR - 1.5) * s, 0, Math.PI * 2);
  ctx.fillStyle = SKIN_FILL;
  ctx.fill();

  return { ex: ex, ey: ey, wx: wx, wy: wy };
}

// ---- Draw pole — returns tip position ----
function drawPole(ctx, wx, wy, poleAngleDeg, poleLen, s) {
  var pA = poleAngleDeg * Math.PI / 180;
  var px = wx + Math.sin(pA) * poleLen * s;
  var py = wy + Math.cos(pA) * poleLen * s;

  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(wx, wy);
  ctx.lineTo(px, py);
  ctx.strokeStyle = '#C8882A';
  ctx.lineWidth = 7 * s;
  ctx.stroke();
  ctx.strokeStyle = POLE_COL;
  ctx.lineWidth = 5 * s;
  ctx.stroke();

  drawStar(ctx, px, py, 8 * s, 5);
  return { x: px, y: py };
}

function drawStar(ctx, cx, cy, r, points) {
  var inner = r * 0.4;
  ctx.beginPath();
  for (var i = 0; i < points * 2; i++) {
    var radius = (i % 2 === 0) ? r : inner;
    var angle  = (i * Math.PI / points) - Math.PI / 2;
    if (i === 0) ctx.moveTo(cx + Math.cos(angle)*radius, cy + Math.sin(angle)*radius);
    else         ctx.lineTo(cx + Math.cos(angle)*radius, cy + Math.sin(angle)*radius);
  }
  ctx.closePath();
  ctx.fillStyle = STAR_COL;
  ctx.fill();
  ctx.strokeStyle = '#C89000';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ---- Main render ----
function render(now) {
  var dt = Math.min(now - lastTime, 50);
  lastTime = now;

  if (blendT < 1) blendT = Math.min(1, blendT + dt / BLEND_MS);

  bobPhase += BOB_SPEED * dt;
  var bob = 0;

  blinkTimer += dt;
  if (!isBlinking && blinkTimer > BLINK_INTERVAL) { isBlinking = true; blinkTimer = 0; }
  if (isBlinking && blinkTimer > BLINK_DURATION)  { isBlinking = false; blinkTimer = 0; }

  if (autoMode) {
    autoHold -= dt;
    if (autoHold <= 0 && blendT >= 1) {
      autoIdx = (autoIdx + 1) % AUTO_SEQ.length;
      autoHold = AUTO_SEQ[autoIdx].hold;
      setState(AUTO_SEQ[autoIdx].pose);
    }
  }

  var srcP = POSES[currentPose] || POSES.idle;
  var dstP = POSES[targetPose]  || POSES.idle;
  var pose = blendPose(srcP, dstP, blendT);

  // Apply swing oscillation when in idle/swing state
  var isSwinging = (targetPose === 'idle' && blendT > 0.6);
  if (isSwinging || (currentPose === 'idle' && blendT < 0.4)) {
    swingPhase += SWING_SPEED * dt;
  }
  var swingWeight = 0;
  if (targetPose === 'idle')        swingWeight = Math.min(1, (blendT - 0.5) * 2);
  else if (currentPose === 'idle')  swingWeight = Math.max(0, (0.4 - blendT) * 2.5);
  swingWeight = Math.max(0, Math.min(1, swingWeight));

  var swingOsc = Math.sin(swingPhase) * SWING_AMP;
  // In full swing, override rUpper+poleAngle with rigid-rod angle from shoulder
  // rodAngle = single angle that drives the whole arm+pole as one unit
  var rodAngle = SWING_CENTER + swingOsc * swingWeight;
  if (swingWeight > 0) {
    // Blend: in swing, drive arm angle directly; pole stays straight (continuation of arm)
    pose.rUpper    = lerp(pose.rUpper,    rodAngle,           swingWeight);
    pose.rLower    = lerp(pose.rLower,    0,                  swingWeight * 0.5);
    pose.poleAngle = lerp(pose.poleAngle, rodAngle + 10,      swingWeight);
  }

  if (pose.bob) bob = Math.sin(bobPhase) * BOB_AMP;

  var s = SCALE;
  var CW = canvas.width, CH = canvas.height;

  ctx.clearRect(0, 0, CW, CH);
  ctx.save();
  ctx.translate(0, bob * s);

  // 1. Draw body sprite (no arms) — sprite is 220×220, draw at actual size
  var useImg = isBlinking ? blinkImg : bodyImg;
  if (!useImg) useImg = bodyImg;
  if (useImg) {
    ctx.globalAlpha = 1;
    ctx.drawImage(useImg, 0, 0, FH * SCALE, FH * SCALE);
  }

  // 2. Draw left arm (behind body in idle, could layer later)
  var ls = drawArm(ctx, L_SHX*s, L_SHY*s,
    pose.lUpper, pose.lLower,
    UPPER_LEN, LOWER_LEN, HAND_R, s);

  // 3. Draw right arm + pole
  var rs = drawArm(ctx, R_SHX*s, R_SHY*s,
    pose.rUpper, pose.rLower,
    UPPER_LEN, LOWER_LEN, HAND_R, s);

  // Pole attached to right hand wrist
  if (rs) {
    var poleTip = drawPole(ctx, rs.wx, rs.wy, pose.poleAngle, POLE_LEN, s);

    // Net hangs from pole tip — rope + net bag
    if (poleTip) {
      var netSwing = swingWeight > 0.1;
      // Net rope hangs DOWNWARD from pole tip, with pendulum lag (phase offset behind pole)
      // ropeAngle: 0 = straight down. Pendulum lags the pole by ~0.8 rad (bigger lag for wide swing)
      var pendulumSwing = netSwing ? Math.sin(swingPhase - 0.8) * SWING_AMP * 0.5 : 0;
      var ropeAngle = pendulumSwing * Math.PI / 180;
      var netX = poleTip.x + Math.sin(ropeAngle) * NET_LEN * s;
      var netY = poleTip.y + Math.cos(ropeAngle) * NET_LEN * s;

      // Rope line
      ctx.beginPath();
      ctx.moveTo(poleTip.x, poleTip.y);
      ctx.lineTo(netX, netY);
      ctx.strokeStyle = '#888866';
      ctx.lineWidth = 1.5 * s;
      ctx.stroke();

      // Net bag (circle)
      ctx.beginPath();
      ctx.arc(netX, netY, 9 * s, 0, Math.PI * 2);
      ctx.strokeStyle = '#aaaaaa';
      ctx.lineWidth = 2 * s;
      ctx.stroke();
      // Net mesh lines
      ctx.beginPath();
      ctx.moveTo(netX - 7*s, netY); ctx.lineTo(netX + 7*s, netY);
      ctx.moveTo(netX, netY - 7*s); ctx.lineTo(netX, netY + 7*s);
      ctx.strokeStyle = '#888888';
      ctx.lineWidth = 1 * s;
      ctx.stroke();
    }
  }

  ctx.restore();

  document.getElementById('status').textContent =
    'pose: ' + currentPose + ' > ' + targetPose +
    ' t=' + blendT.toFixed(2) +
    '  lUpper=' + pose.lUpper.toFixed(1) +
    '  rUpper=' + pose.rUpper.toFixed(1);

  requestAnimationFrame(render);
}

function loadImg(src) {
  return new Promise(function(r) {
    var img = new Image();
    img.onload = function() { r(img); };
    img.src = src;
  });
}
